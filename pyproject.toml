[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ampanion"
version = "0.1.0"
description = "Your Plexamp companion for playlists that make themselves."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",  # TZ names for zoneinfo where the image has no system time zone database
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ampanion*"]

[tool.setuptools.package-data]
ampanion = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
