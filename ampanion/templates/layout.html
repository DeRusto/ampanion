<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · ampanion</title>
  <link rel="stylesheet" href="/static/ampanion.css">
</head>
<body>
  <nav class="sidebar">
    <a class="brand" href="/">
      <span class="wordmark"><span class="amp">Amp</span><span class="anion">anion</span></span>
      <span class="tagline">Your Plexamp companion for playlists that make themselves.</span>
    </a>
    <a class="item{% if page == 'home' %} on{% endif %}" href="/">Home</a>
    <a class="item settings{% if page == 'settings' %} on{% endif %}" href="/settings">Settings</a>
  </nav>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
